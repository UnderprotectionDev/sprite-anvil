[package]
name = "app"
version = "0.1.0"
description = "Sprite Anvil desktop app"
authors = ["Sprite Anvil"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"

[features]
webdriver = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2.7.1", features = ["watch"] }
tauri-plugin-wdio = { version = "1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
