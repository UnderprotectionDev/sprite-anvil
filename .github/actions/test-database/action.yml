name: Prepare test databases
description: >-
  Wait for the local Neon proxy, apply the current schema to a template database on the PostgreSQL service
  container, clone one disposable database per test family, and export every
  *_TEST_DATABASE_URL the test suites read.

runs:
  using: composite
  steps:
    - name: Resolve the proxy host and wait for the Neon proxy
      shell: bash
      run: |
        echo "127.0.0.1 db.localtest.me" | sudo tee -a /etc/hosts
        for attempt in $(seq 1 30); do
          if curl -s -o /dev/null http://db.localtest.me:4444; then exit 0; fi
          sleep 2
        done
        echo "::error::The local Neon proxy did not start on port 4444."
        exit 1
    - name: Create the schema template
      shell: bash
      env:
        PGPASSWORD: postgres
      run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE schema_template"
    # db:push is restricted to disposable loopback PostgreSQL (NEON_LOCAL + DB_PUSH_DISPOSABLE).
    - name: Apply the schema to the template
      shell: bash
      env:
        DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/schema_template
        NEON_LOCAL: "true"
        DB_PUSH_DISPOSABLE: "true"
      run: bun run --cwd packages/db db:push
    # Profile integration tests only accept their own disposable loopback
    # database names, so each family gets its own clone.
    - name: Clone test databases and export their URLs
      shell: bash
      env:
        PGPASSWORD: postgres
      run: |
        declare -A databases=(
          [ANIMATION_TIMING_REVIEW]=animation_timing_test
          [ASSET_FAMILY_COMPARISON]=asset_family_comparison_test
          [BACKGROUND_LAYER_LAYOUT]=background_layer_layout_test
          [DEPENDENCY]=dependency_test
          [DIRECTIONAL_REVIEW]=directional_test
          [GAMEPLAY]=gameplay_test
          [ICON_FAMILY_REVIEW]=icon_family_review_test
          [PORTRAIT_REVIEW]=portrait_review_test
          [TILESET_ADJACENCY]=tileset_adjacency_test
          [UI_STATE_COMPARISON]=ui_state_comparison_test
          [UI_STRETCH]=ui_stretch_test
          [VFX_APPEARANCE_REVIEW]=vfx_appearance_test
          [VFX]=vfx_test
        )
        for database in context_test "${databases[@]}"; do
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -q \
            -c "CREATE DATABASE $database TEMPLATE schema_template"
        done
        for name in "${!databases[@]}"; do
          echo "${name}_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/${databases[$name]}" >> "$GITHUB_ENV"
        done
        # createDb (neon-http) tests reach PostgreSQL through the local Neon proxy. Exported under
        # its own name so jobs opt in by mapping it to CONTEXT_TEST_DATABASE_URL.
        echo "NEON_PROXY_TEST_DATABASE_URL=postgres://postgres:postgres@db.localtest.me:5432/context_test" >> "$GITHUB_ENV"
