name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

# A new commit on the same PR (or main) supersedes the in-flight run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_SERVER_URL: http://127.0.0.1:3000

jobs:
  # Decides which heavy jobs a change needs. Docs-only changes skip them, but `ci-ok` still reports.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!**/*.md"
            desktop:
              - "**"
              - "!docs/**"
              - "!**/*.md"
              - "!apps/server/**"
              - "!apps/fumadocs/**"

  # Offline Markdown link check; runs on every change because code moves break doc links too.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml './**/*.md'
          jobSummary: true

  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun test ./scripts
      - name: Check conventions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            bun run check:conventions --base "origin/$BASE_REF"
          else
            bun run check:conventions
          fi

  quality:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run check
      - run: bun run check-types
      # Static, DB-free: migrations after the baseline must keep older branches working.
      - run: bun run db:check
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # Install the browser revision required by the web workspace's locked Playwright.
      - run: bun run --cwd apps/web e2e:install --with-deps
      - run: bun run test:workspaces

  # Database-backed tests: disposable migration checks plus server integration tests against PostgreSQL.
  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ARCHIVE_ATOMIC_SUITES: >-
        ./src/features/project-archives/server/tests/project-archive-batch.integration.test.ts
        ./src/project-archive-foundation.integration.test.ts
        ./src/project-archive-delivery.integration.test.ts
        ./src/project-archive-history.integration.test.ts
      NEON_HTTP_REVIEW_SUITES: >-
        ./src/version-review.integration.test.ts
        ./src/batch-version-review.integration.test.ts
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Real Neon proxy in front of PostgreSQL so tests exercise the production neon-http driver.
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a
        # The proxy keeps its control table in the default `postgres` database so the
        # test databases hold only the application schema that db:push owns.
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/postgres
        ports: ["4444:4444"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/test-database
        id: test-database
      - name: Verify migrations with disposable PostgreSQL
        env:
          DB_TEST_POSTGRES: "true"
        # The runner image ships PostgreSQL binaries; install them only if a future image drops them.
        run: |
          if [ -z "$(find /usr/lib/postgresql -path '*/bin/initdb' -print -quit 2>/dev/null)" ]; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          DB_POSTGRES_BIN="$(dirname "$(find /usr/lib/postgresql -path '*/bin/initdb' -print -quit)")"
          export DB_POSTGRES_BIN
          bun test packages/db/scripts/database-preparation.integration.test.ts packages/db/scripts/migration-source.integration.test.ts
      # Profile integration tests (bun-sql on their loopback databases); createDb tests skip here.
      - name: Run server integration tests
        working-directory: apps/server
        run: bun test src
      - name: Verify atomic writes with the production database adapters
        working-directory: apps/server
        env:
          ARCHIVE_BATCH_TEST_DATABASE_URL: ${{ env.NEON_PROXY_TEST_DATABASE_URL }}
          CONTEXT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/context_test
        run: |
          read -ra suites <<< "$PROJECT_ARCHIVE_ATOMIC_SUITES"
          for suite in "${suites[@]}"; do
            test -f "$suite"
          done
          # Permanent Erasure also runs with Neon HTTP in the broad step.
          bun test "${suites[@]}" \
            ./src/features/permanent-erasure/server/tests/database-erasure-deletion-storage.integration.test.ts \
            --timeout 30000
      - name: Verify Review Event publication with Neon HTTP
        working-directory: apps/server
        env:
          CONTEXT_TEST_DATABASE_URL: ${{ env.NEON_PROXY_TEST_DATABASE_URL }}
        run: |
          read -ra suites <<< "$NEON_HTTP_REVIEW_SUITES"
          for suite in "${suites[@]}"; do
            test -f "$suite"
          done
          bun test "${suites[@]}" --timeout 120000
      - name: Run server tests with Neon HTTP
        working-directory: apps/server
        env: &neon-http-test-env
          CONTEXT_TEST_DATABASE_URL: ${{ env.NEON_PROXY_TEST_DATABASE_URL }}
          # Tests that load the app-root composition read the validated server environment.
          DATABASE_URL: ${{ env.NEON_PROXY_TEST_DATABASE_URL }}
          BETTER_AUTH_SECRET: integration-test-secret-not-for-production-use
          BETTER_AUTH_URL: http://localhost:3000
          CORS_ORIGIN: http://localhost:3001
          # Asset Records, Asset Versions and Family Readiness exceed the proxy timeout.
          # Production Experiments failed with storage_unavailable, and Project Archive
          # download failed its stream cancellation assertion in the same CI run.
          NEON_HTTP_ADVISORY_SUITES: >-
            ./src/asset-records.integration.test.ts
            ./src/asset-versions.integration.test.ts
            ./src/family-readiness.integration.test.ts
            ./src/features/production-experiments/server/tests/production-experiments.integration.test.ts
            ./src/features/project-archives/server/tests/project-archive-download.test.ts
        run: |
          dedicated_suites="$PROJECT_ARCHIVE_ATOMIC_SUITES $NEON_HTTP_REVIEW_SUITES $NEON_HTTP_ADVISORY_SUITES"
          suites=()
          while IFS= read -r -d '' suite; do
            case " $dedicated_suites " in
              *" $suite "*) continue ;;
            esac
            suites+=("$suite")
          done < <(find ./src -type f -name '*.test.ts' -print0)
          test "${#suites[@]}" -gt 0
          bun test "${suites[@]}" --timeout 30000
      - name: Run known failing Neon HTTP suites (advisory)
        if: ${{ !cancelled() && steps.test-database.outcome == 'success' }}
        continue-on-error: true
        working-directory: apps/server
        env: *neon-http-test-env
        run: |
          read -ra suites <<< "$NEON_HTTP_ADVISORY_SUITES"
          status=0
          printf '### Neon HTTP advisory suites\n\n' >> "$GITHUB_STEP_SUMMARY"
          for suite in "${suites[@]}"; do
            if [[ ! -f "$suite" ]]; then
              printf '::warning file=%s::Advisory suite file is missing. Update its CI entry.\n' "${suite#./}"
              printf -- '- <code>%s</code> is missing.\n' "$suite" >> "$GITHUB_STEP_SUMMARY"
              status=1
            elif bun test "$suite" --timeout 30000; then
              printf '::notice file=%s::Neon HTTP advisory suite passed. Review for required coverage.\n' "${suite#./}"
              printf -- '- <code>%s</code> passed. Review for required coverage.\n' "$suite" >> "$GITHUB_STEP_SUMMARY"
            else
              printf -- '- <code>%s</code> failed. See the test output.\n' "$suite" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          done
          exit "$status"

  web-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # Install the browser revision required by the web workspace's locked Playwright.
      - run: bun run --cwd apps/web e2e:install --with-deps
      - run: bun run build
      # Database-backed flows keep their own opt-in fixtures and skip here.
      - run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  desktop-webdriver:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
          version: tauri-1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri
      - run: bun run --cwd apps/web desktop:test:build
      - name: Run database-independent desktop WebDriver checks
        run: xvfb-run bun run --cwd apps/web desktop:test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-results
          path: apps/web/desktop-e2e-results
          retention-days: 7

  godot-golden:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot: ['4.3', '4.4', '4.5']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Download the supported official Godot binary
        env:
          GH_TOKEN: ${{ github.token }}
          GODOT_VERSION: ${{ matrix.godot }}
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          gh release download "$GODOT_VERSION-stable" --repo godotengine/godot-builds --pattern "Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" --dir "$RUNNER_TEMP/godot"
          unzip "$RUNNER_TEMP/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Load the golden output in Godot
        run: bun test packages/api/src/godot-golden.test.ts --timeout 120000

  # The single check to require on `main`: passes when every needed job passed or was skipped.
  ci-ok:
    if: always()
    needs: [changes, docs, conventions, quality, integration, web-e2e, desktop-webdriver, godot-golden]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled'; then
            echo "::error::At least one CI job failed or was cancelled."
            exit 1
          fi
