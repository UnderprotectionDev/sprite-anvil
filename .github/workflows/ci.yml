name: CI

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check-types
      - name: Verify migrations with disposable PostgreSQL
        env:
          DB_TEST_POSTGRES: "true"
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql
          export DB_POSTGRES_BIN="$(dirname "$(find /usr/lib/postgresql -path '*/bin/initdb' -print -quit)")"
          bun test packages/db/scripts/database-preparation.integration.test.ts packages/db/scripts/migration-source.integration.test.ts
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  desktop-webdriver:
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
      - run: bun run --cwd apps/web desktop:test:build
      - name: Run database-independent desktop WebDriver checks
        env:
          VITE_SERVER_URL: http://127.0.0.1:3000
        run: xvfb-run bun run --cwd apps/web desktop:test
