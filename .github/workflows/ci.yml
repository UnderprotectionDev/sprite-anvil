name: CI

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: texture_repetition_web_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U e2e -d texture_repetition_web_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check-types
      - name: Verify migrations with disposable PostgreSQL
        env:
          DB_TEST_POSTGRES: "true"
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql
          export DB_POSTGRES_BIN="$(dirname "$(find /usr/lib/postgresql -path '*/bin/initdb' -print -quit)")"
          bun test packages/db/scripts/database-preparation.integration.test.ts packages/db/scripts/migration-source.integration.test.ts
      # Install the browser revision required by the web workspace's locked Playwright.
      - run: bun run --cwd apps/web e2e:install --with-deps
      - run: bun run test
      - run: bun run build
      # Both selections together cover the entire browser suite. Only the texture
      # flow receives this database fixture; other flows retain their own opt-ins.
      - run: bun run test:e2e --grep-invert texture-repetition-reviews
      - name: Run texture browser checks with disposable PostgreSQL
        working-directory: packages/db
        env:
          CONTEXT_TEST_DATABASE_URL: postgresql://e2e:e2e@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/texture_repetition_web_test
        run: |
          bun --eval '
            import { SQL } from "bun";
            import { drizzle } from "drizzle-orm/bun-sql";
            import { migrate } from "drizzle-orm/bun-sql/migrator";
            const client = new SQL(process.env.CONTEXT_TEST_DATABASE_URL);
            try {
              await migrate(drizzle({ client }), { migrationsFolder: "./src/migrations" });
            } finally {
              await client.close();
            }
          '
          bun run --cwd ../.. test:e2e e2e/texture-repetition-reviews.spec.ts

  desktop-webdriver:
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
      - run: bun run --cwd apps/web desktop:test:build
      - name: Run database-independent desktop WebDriver checks
        env:
          VITE_SERVER_URL: http://127.0.0.1:3000
        run: xvfb-run bun run --cwd apps/web desktop:test
