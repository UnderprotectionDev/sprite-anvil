name: CI

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check-types
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  neon-branch:
    if: ${{ github.event_name == 'pull_request' && vars.NEON_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Apply schema and verify on the test branch
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
          CONTEXT_TEST_DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: |
          bun run --cwd packages/db db:migrate
          bun test packages/db/src/neon.test.ts apps/server/src/project-routes.test.ts apps/server/src/project-access.test.ts
      - name: Verify Project Context persistence through the API
        env:
          CONTEXT_TEST_DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: bun test apps/server/src/context-proposals.integration.test.ts apps/server/src/asset-versions.integration.test.ts
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Verify the web Project Context and Asset Version flows
        env:
          CONTEXT_TEST_DATABASE_URL: ${{ steps.branch.outputs.db_url }}
          VITE_SERVER_URL: http://127.0.0.1:3000
        run: bun run --cwd apps/web test:e2e
      - if: always() && steps.branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

  desktop-webdriver:
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
      - if: ${{ github.event_name == 'pull_request' && vars.NEON_PROJECT_ID != '' }}
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: desktop-ci-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - if: ${{ steps.branch.outputs.branch_id != '' }}
        name: Apply schema on the desktop test branch
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: bun run --cwd packages/db db:migrate
      - run: bun run --cwd apps/web desktop:test:build
      - name: Verify the desktop Project Context and Asset Version flows
        env:
          CONTEXT_TEST_DATABASE_URL: ${{ steps.branch.outputs.db_url }}
          VITE_SERVER_URL: http://127.0.0.1:3000
        run: xvfb-run bun run --cwd apps/web desktop:test
      - if: always() && steps.branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
